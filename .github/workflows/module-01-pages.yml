name: Publish A365 Hub workshop modules

on:
  push:
    branches: [main]
    paths:
      - "slides/module-01/**"
      - "slides/module-02/**"
      - "slides/assets/**"
      - "slides/module-01-what-is-agent-id.md"
      - "labs/module-01-security-foundation.md"
      - "labs/module-02-business-agent.md"
      - "labs/workshop/**"
      - "docs/**"
      - "grounding/**"
      - "README.md"
      - "scripts/check-workshop.mjs"
      - "scripts/build-walkthroughs.mjs"
      - "scripts/workshop-*.mjs"
      - "scripts/*Workshop*.ps1"
      - "scripts/*workshop*.ps1"
      - ".github/workflows/module-01-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-automation:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test automation without tenant access
        shell: pwsh
        run: .\scripts\test-workshop-automation.ps1
      - name: Compile workshop infrastructure
        shell: pwsh
        run: |
          az bicep version
          if ($LASTEXITCODE -ne 0) {
            az bicep install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          az bicep build --file .\labs\workshop\infrastructure.bicep --outfile "$env:RUNNER_TEMP\workshop-infrastructure.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build --file .\labs\workshop\applications.bicep --outfile "$env:RUNNER_TEMP\workshop-applications.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build --file .\labs\workshop\model-account.bicep --outfile "$env:RUNNER_TEMP\workshop-model.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  deploy:
    needs: validate-automation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate presentation walkthroughs
        run: |
          node scripts/build-walkthroughs.mjs
          node scripts/check-workshop.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage both standalone presentations
        shell: bash
        run: |
          mkdir -p _site/module-02
          cp slides/module-01/speaker-notes.md _site/speaker-notes.md
          cp slides/module-01/exercise.md _site/exercise.md
          cp slides/module-02/speaker-notes.md _site/module-02/speaker-notes.md
          cp labs/module-02-business-agent.md _site/module-02/lab.md
          touch _site/.nojekyll

      - name: Upload workshop site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
